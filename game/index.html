<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARENA STRIKE — 3인칭 슈팅</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Orbitron:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="scene"></canvas>

      <div id="hud" hidden>
        <div class="hud-top">
          <div class="stat-card">
            <span class="label">WAVE</span>
            <span id="wave">1</span>
          </div>
          <div class="stat-card">
            <span class="label">SCORE</span>
            <span id="score">0</span>
          </div>
          <div class="stat-card">
            <span class="label">KILLS</span>
            <span id="kills">0</span>
          </div>
        </div>

        <div class="crosshair" id="crosshair">
          <i></i><i></i><i></i><i></i>
        </div>

        <div class="hit-marker" id="hit-marker"></div>
        <div class="damage-flash" id="damage-flash"></div>
        <div class="low-hp" id="low-hp"></div>

        <div class="hud-bottom">
          <div class="health-wrap">
            <span class="label">HP</span>
            <div class="bar">
              <div id="hp-fill"></div>
            </div>
            <span id="hp-text">100</span>
          </div>
          <div class="ammo-wrap">
            <span id="ammo">30</span>
            <span class="ammo-split">/</span>
            <span id="reserve">90</span>
            <span class="label ammo-label">AMMO</span>
          </div>
        </div>

        <div id="reload-hint" class="hint" hidden>R — 재장전</div>
        <div id="wave-banner" class="banner" hidden></div>
      </div>

      <div id="menu" class="overlay">
        <div class="menu-panel">
          <p class="kicker">3인칭 슈팅 아레나</p>
          <h1>ARENA STRIKE</h1>
          <p class="desc">
            뒤를 따라오는 카메라로 조준하고, 밀려오는 적 웨이브를 막아내세요.
          </p>
          <ul class="controls">
            <li><kbd>W A S D</kbd> 이동</li>
            <li><kbd>마우스</kbd> 시점 · 조준</li>
            <li><kbd>클릭</kbd> 발사</li>
            <li><kbd>Shift</kbd> 질주 · <kbd>Space</kbd> 점프</li>
            <li><kbd>R</kbd> 재장전 · <kbd>Esc</kbd> 일시정지</li>
          </ul>
          <button id="start-btn" type="button">게임 시작</button>
        </div>
      </div>

      <div id="pause" class="overlay" hidden>
        <div class="menu-panel compact">
          <h2>일시정지</h2>
          <p class="desc">클릭하면 다시 전투가 시작됩니다.</p>
          <button id="resume-btn" type="button">계속하기</button>
        </div>
      </div>

      <div id="gameover" class="overlay" hidden>
        <div class="menu-panel">
          <p class="kicker">MISSION FAILED</p>
          <h1>게임 오버</h1>
          <p class="desc" id="result-text"></p>
          <button id="retry-btn" type="button">다시 도전</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
